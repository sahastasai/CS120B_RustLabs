[package]
name = "lab5"
version = "0.1.0"
authors = ["sahastasai <sahanavsairamesh@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["part1"]
part1 = []
part2 = ["part1"]
part3 = ["part2"]
[[bin]]
name = "lab5"
test = false
bench = false

[dependencies]
heapless = "0.9.3"
panic-halt = "1.0.0"

[dependencies.avr-device]
version = "0.5"
features = ["atmega328p", "rt"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
